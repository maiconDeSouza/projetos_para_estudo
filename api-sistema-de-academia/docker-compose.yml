services:

  postgres:
    image: postgres:17

    container_name: gym-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: "${PG_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: